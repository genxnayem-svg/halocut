<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HaloCut Vector</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="studio.css">
  <link rel="stylesheet" href="vector.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <header>
    <img class="logo" src="logo.png" alt="">
    <div>
      <div class="name">HaloCut <span class="accent">Vector</span></div>
      <div class="host" id="host">After Effects</div>
    </div>
  </header>

  <section class="tab">
    <div class="card-top">
      <span class="tile"><svg viewBox="0 0 24 24"><path d="M4 18 12 5l8 13"/><circle cx="12" cy="5" r="1.8"/><circle cx="4" cy="18" r="1.8"/><circle cx="20" cy="18" r="1.8"/></svg></span>
      <span class="pill">VECTOR · AE</span>
    </div>
    <p class="lead">SVG into real shape layers.</p>
    <p class="hint">Paths, fills and strokes come in as After Effects' own shapes, so you can animate every point. Nothing is imported as a picture.</p>

    <div class="btns v-row"><button class="btn primary small" id="vOpen">Open an SVG…</button><button class="btn small" id="vPasteBtn">Paste SVG code</button></div>
    <input type="file" id="vFile" accept=".svg,image/svg+xml" hidden>
    <textarea id="vPaste" hidden placeholder="&lt;svg …&gt; … &lt;/svg&gt;"></textarea>

    <div class="v-stage"><canvas id="vStage"></canvas></div>
    <div class="v-report" id="vReport"></div>

    <div class="row"><span>Size</span><div class="chips" id="vSize"></div></div>
    <div class="row"><span>Layers</span><div class="chips" id="vLayers"></div></div>
    <div class="row"><span>Draw on</span><div class="chips" id="vDraw"></div></div>
    <label class="row" id="vDrawRow"><span>Drawing takes</span><span class="inline"><input type="range" id="vSecs" min="0.2" max="4" step="0.1" value="1.2"><b id="vSecsOut"></b></span></label>
    <label class="row"><span>One colour for everything</span><span class="inline"><input type="checkbox" id="vRecolour"><input type="color" id="vColour" value="#ffffff"></span></label>

    <div class="foot">
      <span class="sum" id="vSum"><span class="dot"></span><span id="vSumText">Open an SVG, or paste its code</span></span>
      <button class="btn primary" id="vImport" disabled>Import</button>
    </div>
  </section>

  <p class="copy">HaloCut Vector · © 2026 Imtayz Nayem</p>

  <div hidden><div id="status"><span id="statusText"></span></div><ul id="log"></ul></div>
  <script>window.EW_ROLE = "status";</script>
  <script src="CSInterface.js"></script>
  <script src="vector-core.js"></script>
  <script src="main.js"></script>
  <script src="vector.js"></script>
  <script src="hub.js"></script>
</body>
</html>
