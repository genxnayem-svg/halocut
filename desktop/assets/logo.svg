<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- HaloCut logo. © 2026 Imtayz Nayem -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1726"/>
      <stop offset="1" stop-color="#120d17"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".45" stop-color="#ff5d7a"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#ffd0a0"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824 px body with rounded corners -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>

  <!-- glow under the halo -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#halo)" stroke-width="70" opacity=".55" filter="url(#glow)"
          stroke-dasharray="1330 241" stroke-dashoffset="-295" transform="rotate(-90 512 512)"/>
  <!-- the halo, cut open at the top right -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#halo)" stroke-width="62" stroke-linecap="round"
          stroke-dasharray="1330 241" stroke-dashoffset="-295" transform="rotate(-90 512 512)"/>

  <!-- the cut: a bright spark where the ring opens -->
  <circle cx="672" cy="320" r="70" fill="url(#core)"/>
  <circle cx="672" cy="320" r="20" fill="#fff"/>

  <!-- centre: the pointer the wheel opens around -->
  <circle cx="512" cy="512" r="62" fill="#ffffff" opacity=".1"/>
  <circle cx="512" cy="512" r="30" fill="#fff"/>
</svg>
